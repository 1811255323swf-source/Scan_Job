name: Cloud Job Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. 10:00 UTC = 18:00 Asia/Shanghai.
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: cloud-job-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUTF8: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate email secrets
        shell: bash
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run cloud monitor
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send-now]')
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python main.py --config config.yaml --require-email 2>&1 | tee run.log
          elif [ "${{ contains(github.event.head_commit.message, '[send-now]') }}" = "true" ]; then
            python main.py --config config.yaml --force-email --require-email 2>&1 | tee run.log
          else
            python main.py --config config.yaml --no-email 2>&1 | tee run.log
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloud Job Monitor"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            if [ -f reports/latest.md ]; then
              echo "### Latest report"
              echo ""
              cat reports/latest.md
              echo ""
            fi
            echo "<details><summary>Run log</summary>"
            echo ""
            echo '```text'
            cat run.log 2>/dev/null || echo "No run.log was produced."
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-job-report
          path: reports/latest.md
          if-no-files-found: ignore

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/jobs.db reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update job monitor state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No monitor state changes to commit."
          fi

