name: Cloud Job Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: scan_only
        type: choice
        options:
          - scan_only
          - scan_and_email
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. 05:00 UTC is 13:00 Asia/Shanghai.
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: cloud-job-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUTF8: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve run mode
        id: run-mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_date="$(TZ=Asia/Shanghai date +%F)"
          marker=".github/state/job-email-sent/${run_date}"
          mode="test_only"
          should_run="true"
          send_requested="false"
          reason="ready"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode="scan_and_email"
            send_requested="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-scan_only}"
            case "$mode" in
              scan_and_email) send_requested="true" ;;
            esac
          elif [[ "$COMMIT_MESSAGE" == *"[send-now]"* ]]; then
            mode="scan_and_email"
            send_requested="true"
          fi

          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$marker" ]; then
            should_run="false"
            reason="already sent for ${run_date}"
            echo "$reason"
          fi

          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "send_requested=$send_requested" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.run-mode.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.run-mode.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run tests
        if: steps.run-mode.outputs.should_run == 'true'
        run: python -m pytest

      - name: Validate email secrets
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.send_requested == 'true'
        shell: bash
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run cloud monitor
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode != 'test_only'
        shell: bash
        run: |
          set -o pipefail
          case "${{ steps.run-mode.outputs.mode }}" in
            scan_and_email)
              python main.py --config config.yaml --force-email --require-email 2>&1 | tee run.log
              ;;
            *)
              python main.py --config config.yaml --no-email 2>&1 | tee run.log
              ;;
          esac

      - name: Mark email sent
        if: success() && steps.run-mode.outputs.send_requested == 'true' && steps.run-mode.outputs.should_run == 'true'
        shell: bash
        run: |
          sent_flag="reports/email_sent_${{ steps.run-mode.outputs.run_date }}.flag"
          if [ ! -f "$sent_flag" ]; then
            echo "::error::No email sent flag found at $sent_flag"
            exit 1
          fi

          mkdir -p "$(dirname "${{ steps.run-mode.outputs.marker }}")"
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_date=${{ steps.run-mode.outputs.run_date }}"
            echo "sent_at=$(TZ=Asia/Shanghai date --iso-8601=seconds)"
          } > "${{ steps.run-mode.outputs.marker }}"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloud Job Monitor"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Mode: \`${{ steps.run-mode.outputs.mode }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ "${{ steps.run-mode.outputs.should_run }}" != "true" ]; then
              echo "- Skipped: ${{ steps.run-mode.outputs.reason }}"
            fi
            echo ""
            if [ -f reports/latest.md ]; then
              echo "### Latest report"
              echo ""
              cat reports/latest.md
              echo ""
            fi
            echo "<details><summary>Run log</summary>"
            echo ""
            echo '```text'
            cat run.log 2>/dev/null || echo "No monitor run was requested."
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-job-report
          path: reports/latest.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit monitor state
        if: success() && steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode != 'test_only'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=()
          for path in database/seen_hashes.txt .github/state/job-email-sent; do
            [ -e "$path" ] && paths+=("$path")
          done

          if [ "${#paths[@]}" -gt 0 ]; then
            git add -- "${paths[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update job monitor state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No monitor state changes to commit."
          fi
